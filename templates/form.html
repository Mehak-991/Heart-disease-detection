<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Details Form</title>
    <link rel="icon" href="data:," />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background-image: url('/static/images/lab.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }

      .form-card {
        width: 100%;
        max-width: 768px;
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 12px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        padding: 24px;
        transition: background 0.3s ease, transform 0.3s ease;
      }

      .form-card:hover {
        background: rgba(255, 255, 255, 0.6);
        transform: scale(1.02);
      }

      .form-heading {
        font-size: 1.875rem;
        font-weight: 700;
        text-align: center;
        color: #1f2937;
        margin-bottom: 32px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
      }

      @media (min-width: 768px) {
        .form-card {
          padding: 40px;
        }
        .form-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .form-field {
        display: flex;
        flex-direction: column;
      }

      .form-field label {
        margin-bottom: 4px;
        font-weight: 500;
        color: #374151;
        font-size: 0.95rem;
      }

      .form-field input,
      .form-field select {
        width: 100%;
        border-radius: 6px;
        border: 1px solid #d1d5db;
        padding: 8px 16px;
        font-size: 1rem;
        font-family: inherit;
        background: #fff;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .form-field input:focus,
      .form-field select:focus {
        border-color: #60a5fa;
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.3);
      }

      .col-span-2 {
        grid-column: 1 / -1;
      }

      .divider {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 8px 0;
      }

      .divider hr {
        flex-grow: 1;
        border: none;
        border-top: 1px solid #d1d5db;
      }

      .divider span {
        padding: 0 12px;
        color: #6b7280;
        font-size: 0.875rem;
        white-space: nowrap;
      }

      .upload-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 128px;
        padding: 0 16px;
        background: #fff;
        border: 2px dashed #d1d5db;
        border-radius: 6px;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
      }

      .upload-box:hover,
      .upload-box.drag-active {
        border-color: #60a5fa;
        background: #eff6ff;
      }

      .upload-box svg {
        width: 32px;
        height: 32px;
        color: #6b7280;
      }

      .upload-box p {
        margin-top: 8px;
        font-size: 0.875rem;
        color: #4b5563;
      }

      .upload-box .hint {
        font-size: 0.75rem;
        color: #9ca3af;
        margin-top: 4px;
      }

      .file-name {
        margin-top: 8px;
        font-size: 0.875rem;
        color: #374151;
        text-align: center;
      }

      .submit-btn {
        width: 100%;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        font-size: 1rem;
        padding: 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.3s;
        font-family: inherit;
      }

      .submit-btn:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="form-card">
      <h2 class="form-heading">
        Enter Your Health Details
      </h2>

      <form
        action="/predict"
        method="POST"
        enctype="multipart/form-data"
        class="form-grid"
      >
        <!-- Health Inputs -->
        <div class="form-field">
          <label for="age">Age</label>
          <input type="number" name="age" id="age" />
        </div>

        <div class="form-field">
          <label for="sex">Sex</label>
          <select name="sex" id="sex">
            <option value="" disabled selected>Select Type</option>
            <option value="0">Female</option>
            <option value="1">Male</option>
          </select>
        </div>

        <div class="form-field">
          <label for="cp">Chest Pain Type</label>
          <select name="cp" id="cp">
            <option value="" disabled selected>Select Type</option>
            <option value="0">Typical Angina</option>
            <option value="1">Atypical Angina</option>
            <option value="2">Non-anginal Pain</option>
            <option value="3">Asymptomatic</option>
          </select>
        </div>

        <div class="form-field">
          <label for="trestbps">Resting Blood Pressure</label>
          <input type="number" name="trestbps" id="trestbps" />
        </div>

        <div class="form-field">
          <label for="chol">Serum Cholesterol</label>
          <input type="number" name="chol" id="chol" />
        </div>

        <div class="form-field">
          <label for="fbs">Fasting Blood Sugar > 120</label>
          <select name="fbs" id="fbs">
            <option value="" disabled selected>Select Type</option>
            <option value="0">False</option>
            <option value="1">True</option>
          </select>
        </div>

        <div class="form-field">
          <label for="restecg">Resting ECG Results</label>
          <select name="restecg" id="restecg">
            <option value="" disabled selected>Select Type</option>
            <option value="0">Normal</option>
            <option value="1">ST-T Wave Abnormality</option>
            <option value="2">LV Hypertrophy</option>
          </select>
        </div>

        <div class="form-field">
          <label for="thalach">Max Heart Rate</label>
          <input type="number" name="thalach" id="thalach" />
        </div>

        <div class="form-field">
          <label for="exang">Exercise Induced Angina</label>
          <select name="exang" id="exang">
            <option value="" disabled selected>Select Type</option>
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </div>

        <div class="form-field">
          <label for="oldpeak">Oldpeak (ST Depression)</label>
          <input type="number" step="0.1" name="oldpeak" id="oldpeak" />
        </div>

        <div class="form-field">
          <label for="slope">Slope of ST Segment</label>
          <select name="slope" id="slope">
            <option value="" disabled selected>Select Type</option>
            <option value="0">Upsloping</option>
            <option value="1">Flat</option>
            <option value="2">Downsloping</option>
          </select>
        </div>

        <div class="form-field">
          <label for="ca">Major Vessels (0-3)</label>
          <select name="ca" id="ca">
            <option value="" disabled selected>Select</option>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>

        <div class="form-field">
          <label for="thal">Thalassemia</label>
          <select name="thal" id="thal">
            <option value="" disabled selected>Select Type</option>
            <option value="1">Normal</option>
            <option value="2">Fixed Defect</option>
            <option value="3">Reversible Defect</option>
          </select>
        </div>

        <!-- Divider before MRI upload -->
        <div class="col-span-2 divider">
          <hr />
          <span>Or upload MRI image</span>
          <hr />
        </div>

        <!-- MRI UPLOAD -->
        <div class="col-span-2">
          <div id="uploadBox" class="upload-box">
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M7 16V4m0 0l-4 4m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>
            </svg>
            <p><strong>Click to upload</strong> or drag & drop</p>
            <p class="hint">PNG, JPG, JPEG (max 5MB)</p>
            <input id="mri_image" name="mri_image" type="file" accept=".png, .jpg, .jpeg" style="display:none;"/>
          </div>
          <p id="fileName" class="file-name"></p>
        </div>

        <!-- Submit -->
        <div class="col-span-2">
          <button type="submit" class="submit-btn">
            Predict
          </button>
        </div>
      </form>
    </div>

    <script>
      const uploadBox = document.getElementById("uploadBox");
      const fileInput = document.getElementById("mri_image");
      const fileName = document.getElementById("fileName");

      uploadBox.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", () => {
        if (fileInput.files.length > 0) {
          fileName.textContent = `Selected file: ${fileInput.files[0].name}`;
        } else {
          fileName.textContent = "";
        }
      });

      uploadBox.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadBox.classList.add("drag-active");
      });
      uploadBox.addEventListener("dragleave", () => {
        uploadBox.classList.remove("drag-active");
      });
      uploadBox.addEventListener("drop", (e) => {
        e.preventDefault();
        fileInput.files = e.dataTransfer.files;
        fileName.textContent = `Selected file: ${fileInput.files[0].name}`;
        uploadBox.classList.remove("drag-active");
      });
    </script>
  </body>
</html>
