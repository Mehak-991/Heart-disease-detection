<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Details Form</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .bg-sticky {
        background-image: url('/static/images/lab.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }
    </style>
  </head>
  <body class="min-h-screen bg-sticky flex items-center justify-center p-4">
    <div
      class="w-full max-w-3xl bg-white/40 backdrop-blur rounded-xl shadow-2xl hover:bg-white/60 transition duration-300 ease-in-out transform hover:scale-[1.02] p-6 md:p-10"
    >
      <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">
        Enter Your Health Details
      </h2>

      <form
        action="/predict"
        method="POST"
        enctype="multipart/form-data"
        class="grid grid-cols-1 md:grid-cols-2 gap-6"
      >
        <!-- Health Inputs -->
        <div class="flex flex-col">
          <label for="age" class="mb-1 font-medium text-gray-700">Age</label>
          <input
            type="number"
            name="age"
            id="age"
            class="w-full rounded-md border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-400"
          />
        </div>

        <div class="flex flex-col">
          <label for="sex" class="mb-1 font-medium text-gray-700">Sex</label>
          <select
            name="sex"
            id="sex"
            class="w-full rounded-md border border-gray-300 px-4 py-2 bg-white focus:ring-2 focus:ring-blue-400"
          >
            <option value="" disabled selected>Select Type</option>
            <option value="0">Female</option>
            <option value="1">Male</option>
          </select>
        </div>

        <div class="flex flex-col">
          <label for="cp" class="mb-1 font-medium text-gray-700">Chest Pain Type</label>
          <select
            name="cp"
            id="cp"
            class="w-full rounded-md border border-gray-300 px-4 py-2 bg-white focus:ring-2 focus:ring-blue-400"
          >
            <option value="" disabled selected>Select Type</option>
            <option value="0">Typical Angina</option>
            <option value="1">Atypical Angina</option>
            <option value="2">Non-anginal Pain</option>
            <option value="3">Asymptomatic</option>
          </select>
        </div>

        <div class="flex flex-col">
          <label for="trestbps" class="mb-1 font-medium text-gray-700">Resting Blood Pressure</label>
          <input
            type="number"
            name="trestbps"
            id="trestbps"
            class="w-full rounded-md border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-400"
          />
        </div>

        <div class="flex flex-col">
          <label for="chol" class="mb-1 font-medium text-gray-700">Serum Cholesterol</label>
          <input
            type="number"
            name="chol"
            id="chol"
            class="w-full rounded-md border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-400"
          />
        </div>

        <div class="flex flex-col">
          <label for="fbs" class="mb-1 font-medium text-gray-700">Fasting Blood Sugar > 120</label>
          <select
            name="fbs"
            id="fbs"
            class="w-full rounded-md border border-gray-300 px-4 py-2 bg-white focus:ring-2 focus:ring-blue-400"
          >
            <option value="" disabled selected>Select Type</option>
            <option value="0">False</option>
            <option value="1">True</option>
          </select>
        </div>

        <div class="flex flex-col">
          <label for="restecg" class="mb-1 font-medium text-gray-700">Resting ECG Results</label>
          <select
            name="restecg"
            id="restecg"
            class="w-full rounded-md border border-gray-300 px-4 py-2 bg-white focus:ring-2 focus:ring-blue-400"
          >
            <option value="" disabled selected>Select Type</option>
            <option value="0">Normal</option>
            <option value="1">ST-T Wave Abnormality</option>
            <option value="2">LV Hypertrophy</option>
          </select>
        </div>

        <div class="flex flex-col">
          <label for="thalach" class="mb-1 font-medium text-gray-700">Max Heart Rate</label>
          <input
            type="number"
            name="thalach"
            id="thalach"
            class="w-full rounded-md border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-400"
          />
        </div>

        <div class="flex flex-col">
          <label for="exang" class="mb-1 font-medium text-gray-700">Exercise Induced Angina</label>
          <select
            name="exang"
            id="exang"
            class="w-full rounded-md border border-gray-300 px-4 py-2 bg-white focus:ring-2 focus:ring-blue-400"
          >
            <option value="" disabled selected>Select Type</option>
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </div>

        <div class="flex flex-col">
          <label for="oldpeak" class="mb-1 font-medium text-gray-700">Oldpeak (ST Depression)</label>
          <input
            type="number"
            step="0.1"
            name="oldpeak"
            id="oldpeak"
            class="w-full rounded-md border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-blue-400"
          />
        </div>

        <div class="flex flex-col">
          <label for="slope" class="mb-1 font-medium text-gray-700">Slope of ST Segment</label>
          <select
            name="slope"
            id="slope"
            class="w-full rounded-md border border-gray-300 px-4 py-2 bg-white focus:ring-2 focus:ring-blue-400"
          >
            <option value="" disabled selected>Select Type</option>
            <option value="0">Upsloping</option>
            <option value="1">Flat</option>
            <option value="2">Downsloping</option>
          </select>
        </div>

        <div class="flex flex-col">
          <label for="ca" class="mb-1 font-medium text-gray-700">Major Vessels (0-3)</label>
          <select
            name="ca"
            id="ca"
            class="w-full rounded-md border border-gray-300 px-4 py-2 bg-white focus:ring-2 focus:ring-blue-400"
          >
            <option value="" disabled selected>Select</option>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>

        <div class="flex flex-col">
          <label for="thal" class="mb-1 font-medium text-gray-700">Thalassemia</label>
          <select
            name="thal"
            id="thal"
            class="w-full rounded-md border border-gray-300 px-4 py-2 bg-white focus:ring-2 focus:ring-blue-400"
          >
            <option value="" disabled selected>Select Type</option>
            <option value="1">Normal</option>
            <option value="2">Fixed Defect</option>
            <option value="3">Reversible Defect</option>
          </select>
        </div>

        <!-- Divider before MRI upload -->
        <div class="md:col-span-2 flex items-center justify-center my-6">
          <hr class="flex-grow border-gray-300" />
          <span class="px-3 text-gray-600 text-sm">Or upload MRI image</span>
          <hr class="flex-grow border-gray-300" />
        </div>

        <!-- MRI UPLOAD -->
        <div class="md:col-span-2">
          <div id="uploadBox" 
               class="flex flex-col items-center justify-center w-full h-32 px-4 transition bg-white border-2 border-gray-300 border-dashed rounded-md cursor-pointer hover:border-blue-400 hover:bg-blue-50">
            <svg xmlns="http://www.w3.org/2000/svg" 
                 class="w-8 h-8 text-gray-500" 
                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M7 16V4m0 0l-4 4m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>
            </svg>
            <p class="mt-2 text-sm text-gray-600"><span class="font-semibold">Click to upload</span> or drag & drop</p>
            <p class="text-xs text-gray-400">PNG, JPG, JPEG (max 5MB)</p>
            <input id="mri_image" name="mri_image" type="file" accept=".png, .jpg, .jpeg" class="hidden"/>
          </div>
          <!-- Show selected file name -->
          <p id="fileName" class="mt-2 text-sm text-gray-700 text-center"></p>
        </div>

        <!-- Submit -->
        <div class="md:col-span-2">
          <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-md transition duration-300"
          >
            Predict
          </button>
        </div>
      </form>
    </div>

    <script>
      const uploadBox = document.getElementById("uploadBox");
      const fileInput = document.getElementById("mri_image");
      const fileName = document.getElementById("fileName");

      uploadBox.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", () => {
        if (fileInput.files.length > 0) {
          fileName.textContent = `Selected file: ${fileInput.files[0].name}`;
        } else {
          fileName.textContent = "";
        }
      });

      uploadBox.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadBox.classList.add("border-blue-400", "bg-blue-50");
      });
      uploadBox.addEventListener("dragleave", () => {
        uploadBox.classList.remove("border-blue-400", "bg-blue-50");
      });
      uploadBox.addEventListener("drop", (e) => {
        e.preventDefault();
        fileInput.files = e.dataTransfer.files;
        fileName.textContent = `Selected file: ${fileInput.files[0].name}`;
        uploadBox.classList.remove("border-blue-400", "bg-blue-50");
      });
    </script>
  </body>
</html>
